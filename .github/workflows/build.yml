name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV
      - name: Build
        run: |
          make package
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FF-Bone-Tool-IPA
          path: packages/*.ipa
